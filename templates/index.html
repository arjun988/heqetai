<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentDebugger Web Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .event-timeline {
            max-height: 400px;
            overflow-y: auto;
        }
        .event-item {
            border-left: 3px solid #007bff;
            padding: 8px 12px;
            margin: 4px 0;
            background: #f8f9fa;
            border-radius: 0 4px 4px 0;
        }
        .event-item.error {
            border-left-color: #dc3545;
            background: #f8d7da;
        }
        .event-item.tool_call {
            border-left-color: #28a745;
            background: #d4edda;
        }
        .event-item.llm_call {
            border-left-color: #ffc107;
            background: #fff3cd;
        }
        .event-item.reasoning {
            border-left-color: #6f42c1;
            background: #e2d9f3;
        }
        .agent-card {
            transition: all 0.3s ease;
        }
        .agent-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .breakpoint-item {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 4px;
            padding: 8px;
            margin: 4px 0;
        }
        .performance-chart {
            height: 300px;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-running { background-color: #28a745; }
        .status-paused { background-color: #ffc107; }
        .status-error { background-color: #dc3545; }
        .status-idle { background-color: #6c757d; }
        .mock-item {
            background: #e7f3ff;
            border: 1px solid #b3d9ff;
            border-radius: 4px;
            padding: 8px;
            margin: 4px 0;
        }
        .trace-viewer {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 16px;
            border-radius: 4px;
            max-height: 400px;
            overflow-y: auto;
        }
        .json-viewer {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-bug"></i> AgentDebugger Web Portal
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text">
                    <span id="connection-status" class="badge bg-secondary">Disconnected</span>
                </span>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        <!-- Main Dashboard -->
        <div class="row">
            <!-- Summary Cards -->
            <div class="col-md-3">
                <div class="card mb-3">
                    <div class="card-header">
                        <h6 class="mb-0"><i class="fas fa-chart-line"></i> Summary</h6>
                    </div>
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-6">
                                <h4 id="total-events" class="text-primary">0</h4>
                                <small class="text-muted">Events</small>
                            </div>
                            <div class="col-6">
                                <h4 id="active-agents" class="text-success">0</h4>
                                <small class="text-muted">Agents</small>
                            </div>
                        </div>
                        <div class="row text-center mt-2">
                            <div class="col-6">
                                <h4 id="breakpoints-count" class="text-warning">0</h4>
                                <small class="text-muted">Breakpoints</small>
                            </div>
                            <div class="col-6">
                                <h4 id="errors-count" class="text-danger">0</h4>
                                <small class="text-muted">Errors</small>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="card mb-3">
                    <div class="card-header">
                        <h6 class="mb-0"><i class="fas fa-bolt"></i> Quick Actions</h6>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <button class="btn btn-outline-primary btn-sm" onclick="showAddBreakpointModal()">
                                <i class="fas fa-plus"></i> Add Breakpoint
                            </button>
                            <button class="btn btn-outline-info btn-sm" onclick="exportTrace()">
                                <i class="fas fa-download"></i> Export Trace
                            </button>
                            <button class="btn btn-outline-warning btn-sm" onclick="clearAllBreakpoints()">
                                <i class="fas fa-trash"></i> Clear Breakpoints
                            </button>
                            <button class="btn btn-outline-danger btn-sm" onclick="cleanupDebugger()">
                                <i class="fas fa-broom"></i> Clean Memory
                            </button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="refreshAllData()">
                                <i class="fas fa-sync"></i> Refresh All
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9">
                <!-- Tab Navigation -->
                <ul class="nav nav-tabs" id="mainTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="agents-tab" data-bs-toggle="tab" data-bs-target="#agents" type="button">
                            <i class="fas fa-robot"></i> Agents
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="events-tab" data-bs-toggle="tab" data-bs-target="#events" type="button">
                            <i class="fas fa-list"></i> Events
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="breakpoints-tab" data-bs-toggle="tab" data-bs-target="#breakpoints" type="button">
                            <i class="fas fa-stop-circle"></i> Breakpoints
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="performance-tab" data-bs-toggle="tab" data-bs-target="#performance" type="button">
                            <i class="fas fa-tachometer-alt"></i> Performance
                        </button>
                    </li>
                </ul>

                <!-- Tab Content -->
                <div class="tab-content" id="mainTabsContent">
                    <!-- Agents Tab -->
                    <div class="tab-pane fade show active" id="agents" role="tabpanel">
                        <div class="card mt-3">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h6 class="mb-0"><i class="fas fa-robot"></i> Agent States</h6>
                                <button class="btn btn-sm btn-outline-primary" onclick="refreshAgents()">
                                    <i class="fas fa-sync"></i> Refresh
                                </button>
                            </div>
                            <div class="card-body">
                                <div id="agents-container" class="row">
                                    <!-- Agent cards will be populated here -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Events Tab -->
                    <div class="tab-pane fade" id="events" role="tabpanel">
                        <div class="card mt-3">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h6 class="mb-0"><i class="fas fa-list"></i> Trace Events</h6>
                                <div class="btn-group" role="group">
                                    <select id="event-filter" class="form-select form-select-sm" style="width: auto;">
                                        <option value="">All Events</option>
                                        <option value="reasoning_start">Reasoning Start</option>
                                        <option value="reasoning_end">Reasoning End</option>
                                        <option value="tool_call_start">Tool Call Start</option>
                                        <option value="tool_call_end">Tool Call End</option>
                                        <option value="llm_call_start">LLM Call Start</option>
                                        <option value="llm_call_end">LLM Call End</option>
                                        <option value="memory_write">Memory Write</option>
                                        <option value="error">Error</option>
                                    </select>
                                    <button class="btn btn-sm btn-outline-primary" onclick="refreshEvents()">
                                        <i class="fas fa-sync"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="card-body">
                                <div id="events-container" class="event-timeline">
                                    <!-- Events will be populated here -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Breakpoints Tab -->
                    <div class="tab-pane fade" id="breakpoints" role="tabpanel">
                        <div class="card mt-3">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h6 class="mb-0"><i class="fas fa-stop-circle"></i> Breakpoints</h6>
                                <button class="btn btn-sm btn-primary" onclick="showAddBreakpointModal()">
                                    <i class="fas fa-plus"></i> Add Breakpoint
                                </button>
                            </div>
                            <div class="card-body">
                                <div id="breakpoints-container">
                                    <!-- Breakpoints will be populated here -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Performance Tab -->
                    <div class="tab-pane fade" id="performance" role="tabpanel">
                        <div class="card mt-3">
                            <div class="card-header">
                                <h6 class="mb-0"><i class="fas fa-tachometer-alt"></i> Performance Metrics</h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <canvas id="performance-chart" class="performance-chart"></canvas>
                                    </div>
                                    <div class="col-md-6">
                                        <div id="performance-stats">
                                            <!-- Performance stats will be populated here -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <!-- Add Breakpoint Modal -->
    <div class="modal fade" id="addBreakpointModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Breakpoint</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="breakpoint-form">
                        <div class="mb-3">
                            <label for="breakpoint-type" class="form-label">Breakpoint Type</label>
                            <select class="form-select" id="breakpoint-type" required>
                                <option value="before_tool">Before Tool</option>
                                <option value="after_tool">After Tool</option>
                                <option value="before_memory_write">Before Memory Write</option>
                                <option value="after_memory_write">After Memory Write</option>
                                <option value="before_reasoning">Before Reasoning</option>
                                <option value="after_reasoning">After Reasoning</option>
                                <option value="before_llm">Before LLM</option>
                                <option value="after_llm">After LLM</option>
                                <option value="on_error">On Error</option>
                                <option value="on_agent_create">On Agent Create</option>
                                <option value="on_task_start">On Task Start</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="tool-name" class="form-label">Tool Name (optional)</label>
                            <input type="text" class="form-control" id="tool-name" placeholder="e.g., web_search">
                        </div>
                        <div class="mb-3">
                            <label for="agent-id" class="form-label">Agent ID (optional)</label>
                            <input type="text" class="form-control" id="agent-id" placeholder="e.g., agent_0">
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="temporary-breakpoint">
                            <label class="form-check-label" for="temporary-breakpoint">
                                Temporary (one-time use)
                            </label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addBreakpoint()">Add Breakpoint</button>
                </div>
            </div>
        </div>
    </div>


    <!-- Event Detail Modal -->
    <div class="modal fade" id="eventDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Event Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="event-detail-content">
                        <!-- Event details will be populated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
